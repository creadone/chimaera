<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chimaera — 200K points and 30 queries per second</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0;background:#f5f5f5;color:#2d3142}main{max-width:1120px;margin:auto}svg{display:block;width:100%;height:auto}</style>
</head>
<body>
<main>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 688" role="img" aria-labelledby="bench-title bench-desc">
<title id="bench-title">Chimaera: 200,995 points and 31 queries per second</title>
<desc id="bench-desc">Two-hour Linux mixed-load test, September 13, 2026, with 8 vCPUs and 15.6 GiB RAM. Warm end-to-end p99 latency: point 11.10 milliseconds, single-series group 14.04, wide fixed 24.49, wide random 28.16, wide hot 133.21. Each wide query reads 300 series. The latency axis starts at zero.</desc>
<defs>
<style>
text{font-family:'Geist',Arial,sans-serif;fill:#2d3142;font-size:16px}
.mono{font-family:'Geist Mono','SFMono-Regular',Consolas,monospace}
.title{font-family:'Instrument Serif',Georgia,serif;font-size:36px}
.muted{fill:#4f5d75}.small{font-size:12px}.value{font-size:32px;font-weight:500}
</style>
<marker id="bench-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker>
<marker id="bench-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#eb6c36"/></marker>
<marker id="bench-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2e5aa8"/></marker>
</defs>
<rect width="1120" height="688" fill="#f5f5f5"/>
<text x="40" y="40" class="mono small muted">CHIMAERA / MIXED LOAD / LINUX</text>
<text x="40" y="88" class="title">200K points + 30 queries per second</text>
<text x="40" y="116" class="muted">8 vCPU · 15.6 GiB RAM · GroupCommit · 13 September 2026</text>
<line x1="40" y1="144" x2="1080" y2="144" stroke="#bfc0c0"/>
<text x="40" y="176" class="small muted">ACKNOWLEDGED POINTS / S</text>
<text x="40" y="216" class="mono value">200,995</text>
<text x="416" y="176" class="small muted">COMPLETED QUERIES / S</text>
<text x="416" y="216" class="mono value">31.000</text>
<text x="792" y="176" class="small muted">MEASURED READ WINDOW</text>
<text x="792" y="216" class="mono value">2 hours</text>
<line x1="40" y1="240" x2="1080" y2="240" stroke="#bfc0c0"/>
<text x="40" y="276" font-weight="600">Read latency · p99</text>
<text x="1080" y="276" text-anchor="end" class="muted small">WIDE QUERIES: 300 SERIES</text>
<!-- Numeric positions use a linear scale: x = 240 + milliseconds × 4.8. -->
<g stroke="#2d3142" stroke-opacity="0.08" stroke-width="0.8">
<line x1="480" y1="300" x2="480" y2="580"/>
<line x1="720" y1="300" x2="720" y2="580"/>
<line x1="960" y1="300" x2="960" y2="580"/>
</g>
<line x1="240" y1="300" x2="240" y2="580" stroke="#2d3142" stroke-opacity="0.25"/>
<g class="mono small muted" text-anchor="middle">
<text x="240" y="604">0</text><text x="480" y="604">50</text><text x="720" y="604">100</text><text x="960" y="604">150 ms</text>
</g>
<g>
<text x="40" y="328">Point</text>
<rect x="240" y="304" width="53.2687824" height="36" fill="#f5f5f5"/>
<rect x="240" y="304" width="53.2687824" height="36" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" data-metric="point_lookup" data-p99-ms="11.097663"/>
<text x="305.2687824" y="328" class="mono">11.10</text>
<text x="40" y="384">Group · one series</text>
<rect x="240" y="360" width="67.4093952" height="36" fill="#f5f5f5"/>
<rect x="240" y="360" width="67.4093952" height="36" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" data-metric="group_single" data-p99-ms="14.043624"/>
<text x="319.4093952" y="384" class="mono">14.04</text>
<text x="40" y="440">Wide fixed · 1 day</text>
<rect x="240" y="416" width="117.5554464" height="36" fill="#f5f5f5"/>
<rect x="240" y="416" width="117.5554464" height="36" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" data-metric="wide_fixed" data-p99-ms="24.490718"/>
<text x="369.5554464" y="440" class="mono">24.49</text>
<text x="40" y="496">Wide random · 14 days</text>
<rect x="240" y="472" width="135.1798224" height="36" fill="#f5f5f5"/>
<rect x="240" y="472" width="135.1798224" height="36" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75" data-metric="wide_random" data-p99-ms="28.162463"/>
<text x="387.1798224" y="496" class="mono">28.16</text>
<text x="40" y="552">Wide hot · 90 days</text>
<rect x="240" y="528" width="639.3968544" height="36" fill="#f5f5f5"/>
<rect x="240" y="528" width="639.3968544" height="36" fill="#eb6c36" fill-opacity="0.12" stroke="#eb6c36" data-metric="wide_hot_weighted" data-p99-ms="133.207678"/>
<text x="891.3968544" y="552" class="mono" style="fill:#9d451f">133.21</text>
</g>
<line x1="40" y1="624" x2="1080" y2="624" stroke="#bfc0c0"/>
<rect x="40" y="644" width="16" height="8" fill="#4f5d75" fill-opacity="0.15" stroke="#4f5d75"/>
<text x="68" y="656" class="small muted">p99, scheduled start → full result</text>
<text x="1080" y="656" class="small muted" text-anchor="end">60 s warm-up · 7,200 s measured reads · 20% wide</text>
</svg>
</main>
</body>
</html>
